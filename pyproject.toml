[project]
name = "mini-cache"
version = "0.1.0"
description = "A small from-scratch cache server speaking RESP2 (works with redis-cli and Redis clients): TTLs, AOF persistence, replication and client-side sharding"
authors = [
    {name = "Mallem Sofiane",email = "melsopv@gmail.com"}
]
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["cache", "redis", "resp", "asyncio", "replication", "sharding"]
requires-python = ">=3.11,<3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Melsso/mini_cache"
Repository = "https://github.com/Melsso/mini_cache"
Issues = "https://github.com/Melsso/mini_cache/issues"

[project.scripts]
mini_cache = "mini_cache.__main__:main"

[tool.poetry]
packages = [{include = "mini_cache", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"
ruff = ">=0.15.22,<0.16.0"
mypy = ">=2.3.0,<3.0.0"
redis = ">=8.0.1,<9.0.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
